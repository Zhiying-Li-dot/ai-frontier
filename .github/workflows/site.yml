name: Research and publish Pages
on:
  push:
    branches: [main]
    paths-ignore: ["cloud-data/**", "public/data/**"]
  schedule:
    - cron: "13 */4 * * *"
    - cron: "0 1 * * *"
    - cron: "0 10 * * 5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public projection and browser storage
        run: npm test
      - name: Discover public sources without model calls
        run: npm run discover
      - name: Build validated public reading site
        run: npm run build
      - name: Persist public research only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'AI Frontier Pages'
          git config user.email 'research@users.noreply.github.com'
          git add -- cloud-data public/data public/.nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: refresh public source snapshot'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
